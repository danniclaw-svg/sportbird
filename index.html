<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SportBird</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SportBird">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
/* Layout idea: cuaderno de torneo. Cabecera con resumen, pestañas Partidas / Rivales / Tablero, tablero grande con lista de jugadas al lado. */
:root{
  --bg:#e9f6ff; --surface:#ffffff; --ink:#1d1b4b; --muted:#5d5a8a; --line:#cfd8f5;
  --accent:#7c3aed; --accent-ink:#ffffff; --pink:#ff4d94; --sun:#ffb703; --teal:#12b5a6; --sky:#2f8cff;
  --win:#16a34a; --draw:#e69500; --loss:#e63946;
  --sq-light:#eef1f8; --sq-dark:#8a9bd6; --hl:rgba(255,214,10,.65);
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Source Sans 3",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17143a; --surface:#241f5a; --ink:#f2f0ff; --muted:#b9b4ee; --line:#3b3590;
  --accent:#a78bfa; --accent-ink:#17143a; --win:#4ade80; --draw:#fbbf24; --loss:#ff7b86;
  --sq-light:#d9def2; --sq-dark:#5d6fb0; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17143a; --surface:#241f5a; --ink:#f2f0ff; --muted:#b9b4ee; --line:#3b3590;
  --accent:#a78bfa; --accent-ink:#17143a; --win:#4ade80; --draw:#fbbf24; --loss:#ff7b86;
  --sq-light:#d9def2; --sq-dark:#5d6fb0; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);margin:0;line-height:1.1;text-wrap:balance}
.who{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.95rem}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--loss);border-color:var(--loss)}
button:disabled{opacity:.45;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem}
.tile.w b{color:var(--win)}.tile.d b{color:var(--draw)}.tile.l b{color:var(--loss)}
.strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.strip i{width:14px;height:22px;border-radius:3px;display:block}
.r-W{background:var(--win)}.r-D{background:var(--draw)}.r-L{background:var(--loss)}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border:0;border-radius:8px 8px 0 0;background:transparent;padding:10px 16px;border-bottom:3px solid transparent;color:var(--muted)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
.pill{display:inline-block;min-width:26px;text-align:center;border-radius:99px;padding:2px 9px;font-weight:700;font-size:.85rem;color:#fff}
.pill.W{background:var(--win)}.pill.D{background:var(--draw)}.pill.L{background:var(--loss)}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--muted);vertical-align:-1px;margin-right:6px}
.sq.w{background:#fff}.sq.b{background:#222}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
.form .full{grid-column:1/-1}
.note{color:var(--muted);font-size:.9rem}
.banner{background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px}
.chip button{padding:0 8px;border-radius:99px}
.boardwrap{display:grid;grid-template-columns:minmax(0,560px) minmax(220px,1fr);gap:18px;align-items:start}
@media (max-width:760px){.boardwrap{grid-template-columns:1fr}}
.board svg{width:100%;height:auto;display:block;border-radius:8px;touch-action:manipulation}
.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.controls button{flex:1;min-width:48px}
.moves{max-height:420px;overflow:auto;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 6px;font-variant-numeric:tabular-nums}
.moves .n{color:var(--muted);text-align:right;padding:4px 0}
.moves button{border:0;background:transparent;text-align:left;padding:4px 8px;border-radius:6px;font-weight:600}
.moves button.on{background:var(--accent);color:var(--accent-ink)}
.gtitle{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 4px}
.status{font-size:.85rem;color:var(--muted)}
.err{color:var(--loss);font-weight:600}
.empty{color:var(--muted);padding:18px 4px}

header{background:var(--accent);color:#fff;border-radius:16px;padding:18px 20px}
header h1{color:#fff}
header .who{color:#fff}
header .status{color:#fff;opacity:.85}
header input{border-color:transparent;color:#1d1b4b;background:#fff}
header button.primary{background:#fff;color:var(--accent);border-color:#fff;font-weight:800}
.tile{border:2px solid var(--line);border-radius:14px}
.tile b{font-size:2.1rem;color:var(--ink)}
.tile.w b{color:var(--win)}.tile.d b{color:var(--draw)}.tile.l b{color:var(--loss)}
.strip i{width:16px;height:24px;border-radius:5px}
nav{border-bottom:0;gap:8px}
nav button{border:2px solid var(--line);border-radius:99px;background:var(--surface);padding:9px 18px;font-weight:700}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{border-radius:18px;border:2px solid var(--line)}
button{border-width:2px;border-radius:12px}
button.primary{box-shadow:0 3px 0 rgba(29,27,75,.25)}
.controls button{font-size:1.1rem;padding:10px 6px}
.board svg{border-radius:12px}
.moves button.on{background:var(--accent);color:var(--accent-ink)}
.pill{font-size:.9rem;padding:3px 12px}
th{color:var(--accent)}
tbody tr:hover{background:var(--bg)}
.banner{border-color:var(--accent);border-width:2px}

.stack{display:flex;flex-direction:column;gap:16px}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.rec{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border:2px solid var(--line)}
.rec b{font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.bar{display:inline-block;width:70px;height:10px;border-radius:99px;background:var(--line);vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--win)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.badge{border:2px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;opacity:.6;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border:2px solid var(--accent);background:var(--surface)}
.badge .bi{font-size:2rem;line-height:1}
.endmsg{min-height:1.6em;margin-top:8px;font-family:var(--display);font-size:1.2rem;color:var(--accent);font-weight:800;text-align:center}
.notebox{background:var(--bg);border-left:5px solid var(--accent);border-radius:10px;padding:10px 12px;margin:12px 0}
details summary{cursor:pointer;font-weight:700}
input[type=search]{min-width:200px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo svg{width:58px;height:58px;display:block;border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sports{display:flex;gap:8px}
.sports button{flex:1;padding:12px;font-weight:800;font-size:1.05rem;border-radius:14px;border:2px solid var(--line)}
.sports button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin:0 3px 0 6px}
.card.y{background:#f5c400}.card.r{background:var(--loss)}
</style>
</head>
<body>
<div class="wrap" id="app">Cargando…</div>
<script>
(function(){
"use strict";
var STORE_KEY="chess-career-v1";
var state={player:"Mi jugador",games:[],demo:true};
var ui={tab:"games",oppFilter:"",selId:null,ply:0,flip:false,adding:false,editId:null,confirmDel:null,msg:"",q:"",fres:"",fcol:"",speed:900,backup:"",sport:"chess",fbTab:"games",fbAdding:false,fbEditId:null,fbConfirmDel:null,fbq:""};
var save={ref:null,mode:"cargando",timer:null};

var SCHOLAR='1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0';
var FOOL='1. f3 e5 2. g4 Qh4# 0-1';
var RUY='1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6 5. O-O Be7 6. Re1 b5 7. Bb3 d6 1/2-1/2';
function demoPgn(w,b,res,ev,moves){return '[Event "'+ev+'"]\n[White "'+w+'"]\n[Black "'+b+'"]\n[Result "'+res+'"]\n\n'+moves}
var DEMO=[
 {id:"d1",demo:true,date:"2026-09-12",opponent:"Rival de ejemplo A",color:"w",result:"W",event:"Torneo escolar",oppElo:900,myElo:800,notes:"Mate del pastor: ¡cuidado con la dama en f7!",pgn:demoPgn("Mi jugador","Rival de ejemplo A","1-0","Torneo escolar",SCHOLAR)},
 {id:"d2",demo:true,date:"2026-10-03",opponent:"Rival de ejemplo B",color:"w",result:"L",event:"Liga infantil",oppElo:1000,myElo:790,notes:"Me atrapó el mate del loco. No mover los peones del rey tan rápido.",pgn:demoPgn("Mi jugador","Rival de ejemplo B","0-1","Liga infantil",FOOL)},
 {id:"d3",demo:true,date:"2026-10-24",opponent:"Rival de ejemplo A",color:"b",result:"D",event:"Liga infantil",oppElo:920,myElo:805,notes:"",pgn:demoPgn("Rival de ejemplo A","Mi jugador","1/2-1/2","Liga infantil",RUY)},
 {id:"d4",demo:true,date:"2026-11-02",opponent:"Rival de ejemplo C",color:"w",result:"W",event:"Torneo escolar",oppElo:850,myElo:830,notes:"",pgn:demoPgn("Mi jugador","Rival de ejemplo C","1-0","Torneo escolar",SCHOLAR)},
 {id:"d5",demo:true,date:"2026-11-08",opponent:"Rival de ejemplo C",color:"b",result:"W",event:"Torneo escolar",oppElo:880,myElo:845,notes:"",pgn:demoPgn("Rival de ejemplo C","Mi jugador","0-1","Torneo escolar",FOOL)}
];
state.games=DEMO.slice();

function el(t,a,kids){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),a[k]);else if(a[k]!==false&&a[k]!=null)e.setAttribute(k,a[k]===true?"":a[k]);}
 (kids||[]).forEach(function(c){e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e;}
function uid(){return "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function norm(s){return (s||"").trim().toLowerCase().replace(/\s+/g," ")}
var RES={W:"Ganó",D:"Tablas",L:"Perdió"};

/* ---------- guardado ---------- */
function persist(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}
  if(!save.ref)return;
  clearTimeout(save.timer);
  save.timer=setTimeout(function(){
    Promise.resolve(save.ref.set(JSON.parse(JSON.stringify(state)))).then(function(){save.mode="nube";paintStatus()},function(){save.mode="local";paintStatus()});
  },600);
}
function paintStatus(){var s=document.getElementById("savestatus");if(s)s.textContent=save.mode==="nube"?"Guardado en tu cuenta":save.mode==="local"?"Guardado solo en este navegador":"Cargando…"}
function applyLoaded(d){if(d&&Array.isArray(d.games)){state=d;ui.selId=null;ensureFb()}}
function initStore(){
  try{var l=localStorage.getItem(STORE_KEY);if(l){applyLoaded(JSON.parse(l))}}catch(e){}
  save.mode="local";render();
  if(!window.claude||!window.claude.use)return;
  var timeout=new Promise(function(r){setTimeout(function(){r(null)},10000)});
  Promise.race([Promise.all([window.claude.use("db"),window.claude.use("user")]),timeout]).then(function(x){
    if(!x||!x[0]||!x[1])return;
    return Promise.resolve(x[1].id()).then(function(id){
      var ref=x[0].collection("data/users/"+id).doc("chess");
      return Promise.resolve(ref.get()).then(function(snap){
        var ex=typeof snap.exists==="function"?snap.exists():snap.exists;
        var data=ex?(typeof snap.data==="function"?snap.data():snap.data):null;
        save.ref=ref;save.mode="nube";
        if(data&&Array.isArray(data.games)){applyLoaded(data);try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
        render();
      });
    });
  }).catch(function(){save.mode="local";paintStatus()});
}

/* ---------- aperturas ---------- */
var OPEN=[
 ["Mate del pastor","e4 e5 Bc4 Nc6 Qh5"],["Mate del pastor","e4 e5 Qh5"],
 ["Apertura Italiana","e4 e5 Nf3 Nc6 Bc4"],["Apertura Española (Ruy López)","e4 e5 Nf3 Nc6 Bb5"],
 ["Defensa Escocesa","e4 e5 Nf3 Nc6 d4"],["Defensa Petrov","e4 e5 Nf3 Nf6"],["Apertura Abierta (e4 e5)","e4 e5 Nf3"],
 ["Gambito de Rey","e4 e5 f4"],["Apertura Vienesa","e4 e5 Nc3"],["Apertura del Alfil","e4 e5 Bc4"],["Apertura Abierta (e4 e5)","e4 e5"],
 ["Defensa Siciliana","e4 c5"],["Defensa Francesa","e4 e6"],["Defensa Caro-Kann","e4 c6"],["Defensa Escandinava","e4 d5"],
 ["Defensa Pirc / Moderna","e4 d6"],["Defensa Pirc / Moderna","e4 g6"],["Defensa Alekhine","e4 Nf6"],["Peón de rey (otras)","e4"],
 ["Gambito de Dama","d4 d5 c4"],["Defensa Eslava","d4 d5 c4 c6"],["Sistema Londres","d4 d5 Bf4"],["Sistema Londres","d4 Nf6 Bf4"],
 ["India de Rey","d4 Nf6 c4 g6"],["Nimzoindia","d4 Nf6 c4 e6 Nc3 Bb4"],["India de Dama","d4 Nf6 c4 e6 Nf3 b6"],
 ["Peón de dama (d4 d5)","d4 d5"],["Defensas indias (d4 Cf6)","d4 Nf6"],["Peón de dama (otras)","d4"],
 ["Apertura Inglesa","c4"],["Apertura Réti","Nf3"],["Apertura Bird","f4"],["Apertura Larsen","b3"],["Apertura rara","f3"],["Apertura rara","g4"]
].map(function(o){return {name:o[0],seq:o[1].split(" ")}});
function openingName(sans){
  var s=sans.map(function(x){return x.replace(/[+#]/g,"")}),best=null;
  OPEN.forEach(function(o){
    if(o.seq.length>s.length)return;
    for(var i=0;i<o.seq.length;i++)if(o.seq[i]!==s[i])return;
    if(!best||o.seq.length>best.seq.length)best=o;
  });
  return best?best.name:"Otra apertura";
}
var icache={};
function info(g){
  if(!g.pgn)return null;var k=g.id+":"+g.pgn.length;if(icache[k]!==undefined)return icache[k];
  var c=new Chess(),r=null;if(c.load_pgn(g.pgn,{sloppy:true})){var h=c.history();r={plies:h.length,opening:openingName(h)}}
  icache[k]=r;return r;
}

/* ---------- PGN ---------- */
function parsePgn(text){
  var chunks=text.replace(/\r/g,"").split(/\n(?=\[Event\s)/).map(function(s){return s.trim()}).filter(Boolean);
  return chunks.map(function(ch){var c=new Chess();if(!c.load_pgn(ch,{sloppy:true}))return {ok:false,pgn:ch};return {ok:true,pgn:ch,h:c.header(),plies:c.history().length}});
}
function resultFor(h,color){var r=h.Result;if(r==="1/2-1/2")return "D";if(r==="1-0")return color==="w"?"W":"L";if(r==="0-1")return color==="b"?"W":"L";return ""}
function dateFromHeader(d){if(!d||/\?/.test(d))return "";return d.replace(/\./g,"-")}
function colorOf(h){
  var me=norm(state.player);if(!me)return "";
  var w=norm(h.White),b=norm(h.Black);
  if(w&&(w===me||w.indexOf(me)>=0||me.indexOf(w)>=0))return "w";
  if(b&&(b===me||b.indexOf(me)>=0||me.indexOf(b)>=0))return "b";
  return "";
}
function eloOf(h,color,mine){var k=((color==="w")===mine)?"WhiteElo":"BlackElo";return parseInt(h[k],10)||""}
function gameFromParsed(p){
  var h=p.h,color=colorOf(h);if(!color)return null;
  return {id:uid(),date:dateFromHeader(h.Date),opponent:(color==="w"?h.Black:h.White)||"Rival",color:color,
    result:resultFor(h,color),event:h.Event&&h.Event!=="?"?h.Event:"",oppElo:eloOf(h,color,false),myElo:eloOf(h,color,true),notes:"",pgn:p.pgn};
}

/* ---------- estadísticas ---------- */
function sortedGames(){return state.games.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")})}
function ascGames(){return state.games.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")})}
function tally(list){var t={n:list.length,W:0,D:0,L:0};list.forEach(function(g){if(t[g.result]!=null)t[g.result]++});t.pct=t.n?Math.round((t.W+t.D/2)/t.n*100):0;return t}
function opponents(){
  var m={};
  state.games.forEach(function(g){var k=norm(g.opponent)||"(sin nombre)";(m[k]=m[k]||{name:g.opponent||"(sin nombre)",games:[]}).games.push(g)});
  return Object.keys(m).map(function(k){var o=m[k];o.t=tally(o.games);o.last=o.games.map(function(g){return g.date||""}).sort().pop();return o}).sort(function(a,b){return b.t.n-a.t.n||a.name.localeCompare(b.name)});
}
function streak(){
  var s=sortedGames();if(!s.length)return "—";
  var r=s[0].result,n=0;for(var i=0;i<s.length&&s[i].result===r;i++)n++;
  return n+" "+({W:"ganadas",D:"tablas",L:"perdidas"}[r]||"");
}
function maxWinStreak(){var best=0,cur=0;ascGames().forEach(function(g){if(g.result==="W"){cur++;if(cur>best)best=cur}else cur=0});return best}
function records(){
  var wins=state.games.filter(function(g){return g.result==="W"});
  var rated=wins.filter(function(g){return +g.oppElo>0}).sort(function(a,b){return b.oppElo-a.oppElo})[0];
  var fast=null;wins.forEach(function(g){var i=info(g);if(i&&(!fast||i.plies<fast.i.plies))fast={g:g,i:i}});
  var es=state.games.filter(function(g){return +g.oppElo>0}),avg=es.length?Math.round(es.reduce(function(a,g){return a+(+g.oppElo)},0)/es.length):null;
  var op=opponents()[0];
  return {best:rated,fast:fast,avg:avg,streak:maxWinStreak(),freq:op&&op.t.n>1?op:null};
}

/* ---------- logros ---------- */
var BADGES=[
 {i:"🏆",n:"Primera victoria",d:"Gana una partida.",t:function(G){return G.some(function(g){return g.result==="W"})}},
 {i:"🤝",n:"Primeras tablas",d:"Consigue unas tablas.",t:function(G){return G.some(function(g){return g.result==="D"})}},
